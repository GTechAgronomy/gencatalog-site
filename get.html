<!doctype html>
<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8EV2H78B6F"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-8EV2H78B6F');
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Downloading GenCatalog…</title>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 560px;
      margin: 10vh auto;
      padding: 0 24px;
      line-height: 1.5;
      background: #0d0f13;
      color: #f2f3f7;
    }
    a { color: #aeb7ff; }
    h1 { font-size: 22px; margin: 0 0 12px; }
    p { margin: 0 0 16px; }
    .muted { color: #a5a8b4; font-size: 14px; }
    .btn {
      display: inline-block;
      padding: 10px 18px;
      background: #5865e8;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      margin-right: 8px;
    }
    .btn:hover { background: #6b76f0; }
    .btn.secondary { background: transparent; color: inherit; border: 1px solid currentColor; }
  </style>
  <script defer src="/analytics.js"></script>
</head>
<body>
  <h1 id="headline">Starting your download…</h1>
  <p id="body" class="muted">If nothing happens, use the link below.</p>

  <p>
    <a id="primary" class="btn" href="#">Download</a>
    <a id="secondary" class="btn secondary" href="#" style="display:none">Other platform</a>
  </p>

  <p class="muted">Problems? Email <a href="mailto:support@gencatalog.app">support@gencatalog.app</a>.</p>

  <script>
    // Single source of truth — bump this on each release.
    var VERSION = '5.16.28';

    var BASE = 'https://downloads.gencatalog.app/';
    var macUrl = BASE + 'GenCatalog-' + VERSION + '-universal.dmg';
    var winUrl = BASE + 'GenCatalog-' + VERSION + '-Setup.exe';

    var ua = navigator.userAgent;
    var isMobile = /iPhone|iPad|iPod|Android/i.test(ua);
    var isWin = !isMobile && (/Win/i.test(navigator.platform) || /Windows/i.test(ua));
    var isMac = !isMobile && !isWin;

    var primary = document.getElementById('primary');
    var secondary = document.getElementById('secondary');
    var headline = document.getElementById('headline');
    var body = document.getElementById('body');
    var attribution = (function () {
      var key = 'gc_attribution_v1';
      var params = new URLSearchParams(location.search);
      var stored = {};
      try { stored = JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch (_) {}
      var source = (params.get('source') || stored.lastSource || stored.firstSource || '').trim();
      var channel = (params.get('channel') || stored.lastChannel || stored.firstChannel || '').trim();
      var surface = (params.get('surface') || stored.lastSurface || '').trim();
      if (!source && document.referrer) {
        try {
          var ref = new URL(document.referrer);
          var host = ref.hostname.replace(/^www\./, '').toLowerCase();
          var searchSources = {
            'google.com': 'google_organic',
            'bing.com': 'bing_organic',
            'duckduckgo.com': 'duckduckgo_organic',
            'yahoo.com': 'yahoo_organic',
            'ecosia.org': 'ecosia_organic',
            'search.brave.com': 'brave_organic',
            'perplexity.ai': 'perplexity_referral',
            'chatgpt.com': 'chatgpt_referral'
          };
          if (host !== location.hostname) {
            source = searchSources[host] || ('referral_' + host.replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 80));
            channel = channel || (source.indexOf('_organic') !== -1 ? 'organic_search' : (source.indexOf('_referral') !== -1 ? 'ai_referral' : 'referral'));
            surface = surface || 'website';
          }
        } catch (_) {}
      }
      if (source || channel || surface) {
        stored.lastSource = source || stored.lastSource;
        stored.lastChannel = channel || stored.lastChannel;
        stored.lastSurface = surface || stored.lastSurface;
        stored.lastLandingPage = location.href;
        stored.lastSeenAt = new Date().toISOString();
        if (!stored.firstSource && source) stored.firstSource = source;
        if (!stored.firstChannel && channel) stored.firstChannel = channel;
        if (!stored.firstLandingPage) stored.firstLandingPage = location.href;
        try { localStorage.setItem(key, JSON.stringify(stored)); } catch (_) {}
      }
      return { source: source, channel: channel, surface: surface };
    })();

    function withAttribution(url) {
      var next = new URL(url);
      ['source', 'channel', 'surface'].forEach(function (key) {
        if (attribution[key]) next.searchParams.set(key, attribution[key]);
      });
      ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'].forEach(function (key) {
        var value = new URLSearchParams(location.search).get(key);
        if (value) next.searchParams.set(key, value);
      });
      return next.toString();
    }

    if (isMobile) {
      headline.textContent = 'Open this page on your Mac or PC';
      body.textContent = 'GenCatalog is a desktop app. Head to your computer and visit gencatalog.app/get to download.';
      primary.href = 'https://gencatalog.app';
      primary.textContent = 'Back to gencatalog.app';
    } else {
      var target = withAttribution(isWin ? winUrl : macUrl);
      var other = withAttribution(isWin ? macUrl : winUrl);
      var otherLabel = isWin ? 'Download for Mac' : 'Download for Windows';

      primary.href = target;
      primary.textContent = isWin ? 'Download for Windows' : 'Download for Mac';
      secondary.href = other;
      secondary.textContent = otherLabel;
      secondary.style.display = 'inline-block';

      if (typeof gtag === 'function') {
        gtag('event', 'download_redirect', {
          event_category: 'conversion',
          event_label: isWin ? 'Windows installer' : 'Mac installer',
          link_url: target,
          gc_source: attribution.source,
          gc_channel: attribution.channel,
          gc_surface: attribution.surface,
          transport_type: 'beacon'
        });
      }

      // Give analytics a brief moment to queue before the file redirect.
      setTimeout(function () {
        location.replace(target);
      }, 120);
    }
  </script>
</body>
</html>
