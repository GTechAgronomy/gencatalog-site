<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Downloading GenCatalog…</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 560px;
      margin: 10vh auto;
      padding: 0 24px;
      line-height: 1.5;
      color: #111;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0d0d0d; color: #eee; }
      a { color: #7aa7ff; }
    }
    h1 { font-size: 22px; margin: 0 0 12px; }
    p { margin: 0 0 16px; }
    .muted { color: #666; font-size: 14px; }
    .btn {
      display: inline-block;
      padding: 10px 18px;
      background: #2a6df4;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      margin-right: 8px;
    }
    .btn.secondary { background: transparent; color: inherit; border: 1px solid currentColor; }
  </style>
</head>
<body>
  <h1 id="headline">Starting your download…</h1>
  <p id="body" class="muted">If nothing happens, use the link below.</p>

  <p>
    <a id="primary" class="btn" href="#">Download</a>
    <a id="secondary" class="btn secondary" href="#" style="display:none">Other platform</a>
  </p>

  <p class="muted">Problems? Email <a href="mailto:support@gencatalog.app">support@gencatalog.app</a>.</p>

  <script>
    // Single source of truth — bump this on each release.
    var VERSION = '5.15.0';

    var BASE = 'https://downloads.gencatalog.app/';
    var macUrl = BASE + 'GenCatalog-' + VERSION + '-universal.dmg';
    var winUrl = BASE + 'GenCatalog-' + VERSION + '-Setup.exe';

    var ua = navigator.userAgent;
    var isMobile = /iPhone|iPad|iPod|Android/i.test(ua);
    var isWin = !isMobile && (/Win/i.test(navigator.platform) || /Windows/i.test(ua));
    var isMac = !isMobile && !isWin;

    var primary = document.getElementById('primary');
    var secondary = document.getElementById('secondary');
    var headline = document.getElementById('headline');
    var body = document.getElementById('body');

    if (isMobile) {
      headline.textContent = 'Open this page on your Mac or PC';
      body.textContent = 'GenCatalog is a desktop app. Head to your computer and visit gencatalog.app/get to download.';
      primary.href = 'https://gencatalog.app';
      primary.textContent = 'Back to gencatalog.app';
    } else {
      var target = isWin ? winUrl : macUrl;
      var other = isWin ? macUrl : winUrl;
      var otherLabel = isWin ? 'Download for Mac' : 'Download for Windows';

      primary.href = target;
      primary.textContent = isWin ? 'Download for Windows' : 'Download for Mac';
      secondary.href = other;
      secondary.textContent = otherLabel;
      secondary.style.display = 'inline-block';

      // Kick off the download.
      location.replace(target);
    }
  </script>
</body>
</html>
